[package]
name = "audioindexer-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "=4.9.0"
actix-files = "=0.6.6"
actix-http = "=3.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.5.4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
block-buffer = "=0.10.4"
digest = "=0.10.7"
generic-array = "=0.14.7"
sha1 = "=0.10.6"
time = "=0.3.36"
indexmap = "=2.5.0"
hashbrown = "=0.14.5"
idna = "=1.0.3"
idna_adapter = "=1.2.0"
url = "=2.5.2"
bytestring = "=1.3.1"

[profile.release]
opt-level = 3
